# Blueprint do Render: só o backend. O frontend estático vai para a Vercel.
services:
  - type: web
    name: central-operacoes-api
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: CORS_ORIGINS
        sync: false # ex.: https://central-operacoes.vercel.app
      - key: CORS_ORIGIN_REGEX
        sync: false
      - key: OPENROUTER_API_KEY
        sync: false
      - key: OPENROUTER_MODEL
        value: baidu/ernie-5.5-flash-preview:free
      # A borda do Render roda atrás da Cloudflare, que sobrescreve CF-Connecting-IP.
      # Limpe se hospedar sem Cloudflare na frente (volta para o último hop de X-Forwarded-For).
      - key: CLIENT_IP_HEADER
        value: cf-connecting-ip
